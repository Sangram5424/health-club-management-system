# Application Flow:
# React frontend -> secured Spring Boot REST API -> Service layer -> Hibernate/JPA -> MySQL database.

# Server Port
server.port=${SERVER_PORT:8081}

# Application Name
spring.application.name=health-club-api

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/health_club_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:HCMS@2026$JWT#SecureSecretKey!HealthClubManagementSystem@123}
app.jwt.expiration-ms=600000

# CORS Security Configuration
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173},http://localhost:3000

# Razorpay Payment Gateway Keys
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TJPVDicu5xxxx}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:2a39xxxxxxxxxxxxxxxxx}
